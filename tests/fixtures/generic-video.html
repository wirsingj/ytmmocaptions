<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MMOCC Generic Video Fixture</title>
  <style>
    body {
      margin: 0;
      min-height: 140vh;
      background: #161616;
      color: #f2f2f2;
      font-family: sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(320px, 1fr));
      gap: 24px;
      padding: 32px;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <main>
    <video controls muted preload="metadata">
      <track kind="captions" srclang="en" label="English" src="./sample-captions.vtt" default>
    </video>
    <video controls muted preload="metadata">
      <track kind="subtitles" srclang="en" label="English" src="./sample-captions.vtt" default>
    </video>
  </main>
</body>
</html>
