name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build, validate, package, and attach release artifacts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify tag matches package and manifests
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Verify release tag is on main
        shell: pwsh
        run: |
          git fetch origin main
          $tagCommit = git rev-list -n 1 "${{ github.ref_name }}"
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag ${{ github.ref_name }} must point to a commit reachable from origin/main."
          }

      - name: Run release sanity checks
        run: npm run release:sanity

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          Copy-Item "build/chrome/ytmmocaptions-chrome-v$version.zip" "release-artifacts/"
          Copy-Item "build/firefox/ytmmocaptions-firefox-v$version.xpi" "release-artifacts/"
          Copy-Item "downloads/ytmmocaptions-source-v$version.zip" "release-artifacts/"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytmmocaptions-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $artifactPaths = Get-ChildItem release-artifacts -File | ForEach-Object { $_.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @artifactPaths --clobber
          } else {
            gh release create $tag @artifactPaths --title "YTMMOCC $tag" --notes "Automated release artifacts for $tag."
          }
