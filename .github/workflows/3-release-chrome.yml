name: 3) Release Chrome

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish for a manual retry, for example v1.1.4"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-chrome:
    name: Upload and submit Chrome Web Store package
    runs-on: windows-latest
    environment: store-publish
    env:
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - name: Normalize release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } else {
            $tag = "${{ inputs.release_tag }}"
          }
          $tag = "$tag".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required for manual runs."
          }
          if ($tag -match '^V') { $tag = 'v' + $tag.Substring(1) }
          if (-not ($tag -match '^v\d+\.\d+\.\d+$')) {
            throw "Release tag must look like v1.2.3, received: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify tag matches package and manifests
        run: node scripts/verify-release-version.mjs "${{ env.RELEASE_TAG }}"

      - name: Check release tag ancestry
        shell: pwsh
        run: |
          git fetch origin main
          $tagCommit = git rev-list -n 1 "${{ env.RELEASE_TAG }}"
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release tag ${{ env.RELEASE_TAG }} is not reachable from origin/main yet. Continuing because the checked-out tag version was verified."
          }

      - name: Build and run release sanity checks
        run: npm run release:sanity

      - name: Check Chrome Web Store credentials
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @(
            "CHROME_PUBLISHER_ID",
            "CHROME_EXTENSION_ID",
            "CHROME_CLIENT_ID",
            "CHROME_CLIENT_SECRET",
            "CHROME_REFRESH_TOKEN"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            } else {
              Write-Output "$name is configured."
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing Chrome Web Store secrets: $($missing -join ', ')"
          }

      - name: Run selected Chrome Web Store action
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/publish-chrome.mjs --mode="publish" --zip="build/chrome/ytmmocaptions-chrome-v$version.zip"

      - name: Publish summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Chrome Web Store"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release tag: ``${{ env.RELEASE_TAG }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Action: ``publish``"
