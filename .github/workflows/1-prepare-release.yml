name: 1) Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Bump, validate, and open release PR
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify workflow is preparing current main
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          $head = git rev-parse HEAD
          $originMain = git rev-parse origin/main
          if ($head -ne $originMain) {
            throw "Prepare Release must run from the current origin/main commit."
          }

      - name: Bump patch version
        run: npm run version:bump

      - name: Capture release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not ($version -match '^\d+\.\d+\.\d+$')) {
            throw "Invalid release version: $version"
          }
          $tag = "v$version"
          $branch = "release/$tag"
          $localTag = git tag --list $tag
          if (-not [string]::IsNullOrWhiteSpace($localTag)) {
            throw "Release tag already exists locally: $tag"
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check remote tag state for: $tag"
          }
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
            throw "Release tag already exists on origin: $tag"
          }
          $remoteBranch = git ls-remote --heads origin "refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check remote branch state for: $branch"
          }
          if (-not [string]::IsNullOrWhiteSpace($remoteBranch)) {
            throw "Release branch already exists on origin: $branch"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run release sanity checks
        run: npm run release:sanity

      - name: Verify bumped release version
        run: node scripts/verify-release-version.mjs "${{ steps.version.outputs.tag }}"

      - name: Commit release prep
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.version.outputs.branch }}"
          git add package.json package-lock.json manifest.json manifest.chrome.json manifest.firefox.json "downloads/ytmmocaptions-source-${{ steps.version.outputs.tag }}.zip"
          git commit -m "chore: prepare ${{ steps.version.outputs.tag }}"

      - name: Push release prep branch
        run: git push origin HEAD:${{ steps.version.outputs.branch }}

      - name: Open release prep PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $branch = "${{ steps.version.outputs.branch }}"
          $body = @"
          Prepares $tag from the current main branch.

          After this PR is merged, create and publish the GitHub Release for $tag from main. The Firefox and Chrome store workflows derive their release tag from that GitHub Release event and remain gated by the store-publish environment.
          "@
          gh pr create --base main --head $branch --title "chore: prepare $tag" --body $body

      - name: Prepare summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Prepared release PR"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Version: ``${{ steps.version.outputs.version }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Tag to create after merge: ``${{ steps.version.outputs.tag }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Branch: ``${{ steps.version.outputs.branch }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Next: merge the release PR, then create and publish the GitHub Release from ``main``."
